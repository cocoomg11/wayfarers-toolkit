name: Release

# The user publishes a GitHub release tagged vMAJOR.MINOR.PATCH (agents never tag or publish). The build job (read-only) checks the
# tag, the vendored wanderers-core pin, runs the checks, compiles the packs and builds module.zip. A separate upload job, the only one
# with write access, attaches module.json and module.zip to the release. Manual runs build the zip as a workflow artifact only.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build module.zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Release tags must be vMAJOR.MINOR.PATCH (v1.24.0, not 1.24 or v1.24): the version and download URL below come from the tag.
      - name: Check the release tag format
        if: github.event_name == 'release'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Bad release tag::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH (for example v1.24.0). Delete the release and tag, then publish again with a tag like v1.24.0."
            exit 1
          fi
          echo "Release tag $GITHUB_REF_NAME OK"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tag has a changelog section
        if: github.event_name == 'release'
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^## $V" CHANGELOG.md || { echo "::error title=No changelog::CHANGELOG.md has no '## $V' section"; exit 1; }

      - name: Vendored wanderers-core matches its pin
        run: node vendor/wanderers-core/vendor.mjs verify --remote

      - name: Set version and URLs in module.json
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg r "$REPO" --arg tag "$GITHUB_REF_NAME" '
            .version = $v
            | .url = "https://github.com/\($r)"
            | .manifest = "https://github.com/\($r)/releases/latest/download/module.json"
            | .download = "https://github.com/\($r)/releases/download/\($tag)/module.zip"
            | .bugs = "https://github.com/\($r)/issues"
          ' module.json > module.tmp && mv module.tmp module.json

      # With a committed package-lock.json this is `npm ci` (pinned, reproducible). Until one is committed, `npm install` of the
      # exact versions in package.json (no ranges) with install scripts off.
      - name: Install the pinned dev tools
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund --ignore-scripts
          else echo "::warning title=No lockfile::package-lock.json is missing; installing the exact versions from package.json"; npm install --no-save --no-audit --no-fund --ignore-scripts; fi

      - name: Checks
        run: |
          npm run check
          npm run lint
          npm test

      - name: Compile compendium packs
        run: |
          node tools/build-packs.mjs check
          node tools/build-packs.mjs compile

      - name: Check every pack in module.json was built
        run: |
          for p in $(jq -r '.packs[].path' module.json); do
            test -d "$p" && ls "$p" | grep -q . || { echo "missing pack folder $p"; exit 1; }
            echo "$p:"; ls -l "$p"
          done

      # vendor/ ships (core is imported at run time), minus core's dev-only config/ and its vendor tool.
      - name: Build module.zip
        run: |
          zip -r module.zip module.json scripts styles lang sounds packs vendor README.md CHANGELOG.md LICENSE \
            -x 'vendor/wanderers-core/config/*' 'vendor/wanderers-core/vendor.mjs'
          for p in $(jq -r '.packs[].path' module.json) vendor/wanderers-core/index.mjs vendor/wanderers-core/foundry/index.mjs; do
            unzip -l module.zip | grep -q " $p" || { echo "module.zip is missing $p"; exit 1; }
          done
          if unzip -l module.zip | grep -qE ' vendor/wanderers-core/(config/|vendor\.mjs)'; then echo "module.zip has core's dev tools"; exit 1; fi
          unzip -l module.zip

      - name: Read the zipped packs back
        run: |
          rm -rf /tmp/check && mkdir -p /tmp/check && unzip -q module.zip -d /tmp/check
          node --input-type=module -e '
            import { extractPack } from "@foundryvtt/foundryvtt-cli";
            import { readdirSync, readFileSync } from "node:fs";
            const src = "/tmp/check/packs/macros";
            await extractPack(src, "/tmp/check/out", { log: false });
            const docs = readdirSync("/tmp/check/out").map(f => JSON.parse(readFileSync(`/tmp/check/out/${f}`, "utf8")));
            const macros = docs.filter(d => d._key?.startsWith("!macros!")).map(d => d.name).sort();
            const folders = docs.filter(d => d._key?.startsWith("!folders!")).map(d => d.name).sort();
            console.log(`::notice title=module.zip packs/macros::files ${readdirSync(src).join(" ")} | ${macros.length} macros: ${macros.join(", ")} | folders: ${folders.join(", ")}`);
            const want = readdirSync("src/packs/macros").filter(f => !f.startsWith("_folder_")).length;
            if (macros.length !== want) { console.error(`expected ${want} macros, found ${macros.length}`); process.exit(1); }
          '

      - name: Keep module.json and module.zip for the upload job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module
          path: |
            module.json
            module.zip
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload the release assets
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(jq -r .version dist/module.json)"
          test "v$V" = "$GITHUB_REF_NAME" || { echo "::error::module.json version $V doesn't match tag $GITHUB_REF_NAME"; exit 1; }
          sha256sum dist/module.zip
          gh release upload "$GITHUB_REF_NAME" dist/module.json dist/module.zip --clobber --repo "$GITHUB_REPOSITORY"
