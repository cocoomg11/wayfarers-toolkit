name: Release

on:
  release:
    types: [published]
  # Manual run: builds module.zip (packs included) as a workflow artifact without touching any release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version and URLs in module.json
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg r "$REPO" --arg tag "$GITHUB_REF_NAME" '
            .version = $v
            | .url = "https://github.com/\($r)"
            | .manifest = "https://github.com/\($r)/releases/latest/download/module.json"
            | .download = "https://github.com/\($r)/releases/download/\($tag)/module.zip"
            | .bugs = "https://github.com/\($r)/issues"
          ' module.json > module.tmp && mv module.tmp module.json

      - name: Compile compendium packs
        run: |
          npm install --no-save --no-audit --no-fund
          node tools/build-packs.mjs check
          node tools/build-packs.mjs compile

      - name: Check every pack in module.json was built
        run: |
          for p in $(jq -r '.packs[].path' module.json); do
            test -d "$p" && ls "$p" | grep -q . || { echo "missing pack folder $p"; exit 1; }
            echo "$p:"; ls -l "$p"
          done

      - name: Build module.zip
        run: |
          zip -r module.zip module.json scripts styles lang sounds packs README.md LICENSE
          for p in $(jq -r '.packs[].path' module.json); do
            unzip -l module.zip | grep -q " $p/" || { echo "module.zip is missing $p"; exit 1; }
          done
          unzip -l module.zip

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber

      - name: Keep module.zip as a workflow artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: module
          path: module.zip
