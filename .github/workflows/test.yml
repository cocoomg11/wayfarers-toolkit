name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Core pin check (vendor/wanderers-core matches wanderers-core.lock.json and the published release), syntax, lint, types, tests.
  checks:
    uses: cocoomg11/wanderers-core/.github/workflows/module-checks.yml@v0.5.1
    with:
      types: true # JSDoc type check (npm run types); keep scripts/ JSDoc-clean

  packs:
    name: Macro pack sources match scripts/macros.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/build-packs.mjs check
